apiVersion: apps/v1
kind: Deployment
metadata:
  name: atow-website
  namespace: atow
  labels:
    app: atow-website
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: atow-website
  template:
    metadata:
      labels:
        app: atow-website
    spec:
      containers:
        - name: nginx
          # The short sha the site repo's build-push workflow pushed.
          image: registry.k6nis.dev/atow/website:051dc1d
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
