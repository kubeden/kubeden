apiVersion: v1
kind: ConfigMap
metadata:
  name: dan-page
  namespace: dan
# The whole site. Mounted into nginx as /usr/share/nginx/html/index.html —
# kubelet syncs volume-mounted ConfigMaps in place, so editing the page here
# and letting argocd sync it needs no rollout.
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>hi dan</title>
      <meta name="robots" content="noindex">
      <style>
        :root { --ink: #111; --paper: #fff; --mute: #8a8a8a; --rule: #e6e6e6; }
        @media (prefers-color-scheme: dark) {
          :root { --ink: #f1f1f1; --paper: #0d0d0d; --mute: #7b7b7b; --rule: #232323; }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
          margin: 0;
          padding: 32px;
          background: var(--paper);
          color: var(--ink);
          font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          display: flex;
          align-items: center;
          justify-content: center;
          -webkit-font-smoothing: antialiased;
        }
        main { width: 100%; max-width: 32rem; }
        h1 {
          margin: 0 0 1.25rem;
          font-size: 2.25rem;
          font-weight: 500;
          letter-spacing: -0.02em;
        }
        p { margin: 0 0 0.9rem; }
        .mute { color: var(--mute); }
        hr { margin: 1.75rem 0 1rem; border: 0; border-top: 1px solid var(--rule); }
        footer {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          color: var(--mute);
          font-size: 12px;
        }
        .dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #ff5fa2;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>hi dan</h1>
        <p>denis asked for this out loud in discord with you sitting there. so: hi.</p>
        <p class="mute">one commit to kubeden/kubeden, argocd picked it up,
          cert-manager did the tls, external-dns did the name. nothing here was
          applied by hand.</p>
        <hr>
        <footer><span class="dot"></span> built by darling &middot; 2026-07-30</footer>
      </main>
    </body>
    </html>
