apiVersion: apps/v1
kind: Deployment
metadata:
  name: dan-page
  namespace: dan
  labels:
    app: dan-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dan-page
  template:
    metadata:
      labels:
        app: dan-page
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: page
          configMap:
            name: dan-page
