apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: innkeeper-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeden/kubeden.git
    targetRevision: main
    path: k8s-cluster-configuration/applications/innkeeper-app/base
  destination:
    server: https://kubernetes.default.svc
    namespace: innkeeper
  syncPolicy:
    syncOptions:
      # The namespace is shared with innkeeper-gateway and innkeeper-landing,
      # and the gateway's Application is the one that has it in git. This app
      # creates it only so a sync in the wrong order still works.
      - CreateNamespace=true
      - ServerSideApply=true
