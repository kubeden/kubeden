apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: innkeeper-downloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeden/kubeden.git
    targetRevision: main
    path: k8s-cluster-configuration/applications/innkeeper-downloads/base
  destination:
    server: https://kubernetes.default.svc
    namespace: innkeeper
  syncPolicy:
    syncOptions:
      # The namespace is innkeeper-gateway's; this only makes a sync in
      # the wrong order survive.
      - CreateNamespace=true
      - ServerSideApply=true
