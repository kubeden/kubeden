apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace.yml and no gateway.yml here on purpose. innkeeper-gateway owns
# both: the namespace this shares with it, and the one HTTPRoute that splits
# innkeeper.a2w.io between `/` (here), `/app`, and the gateway's own paths.
resources:
  - deployment.yml
  - service.yml
