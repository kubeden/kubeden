apiVersion: apps/v1
kind: Deployment
metadata:
  name: innkeeper-relay
  namespace: innkeeper-relay
  labels:
    app: innkeeper-relay
spec:
  # Two, now that a pod can wake another pod's readers. The mailboxes
  # have been on a rented redis since the store landed (a2wio/innkeeper,
  # innkeeper/relaystore.py) but a phone posting to one pod could not
  # wake a daemon's websocket parked on another any faster than that
  # reader's backoff — so a second replica bought availability and cost
  # latency on the one thing that has to feel instant. Every write now
  # publishes a wake on the same round trip that stores the envelope,
  # and every pod holds one subscription to it. A pod that cannot hear
  # the others says so at /v1/health and shortens its own ceiling to
  # two seconds while it cannot, so the worst case is bounded either
  # way.
  replicas: 2
  strategy:
    # Safe now that the queues outlive the pod: the new one reads the
    # same shelf the old one was reading, so an overlap is two doors
    # into one room rather than two rooms.
    type: RollingUpdate
  selector:
    matchLabels:
      app: innkeeper-relay
  template:
    metadata:
      labels:
        app: innkeeper-relay
    spec:
      containers:
        - name: innkeeper-relay
          # Built from the Dockerfile at the root of a2wio/innkeeper
          # (private repo) by that repo's own build-push workflow, on
          # every push to main that touches the daemon.
          #
          # Pinned to a commit rather than :latest for as long as
          # a2wio/innkeeper#41 is open: the cross-pod wakeup above is on
          # that branch, and :latest is whatever main last built. Back
          # to :latest when it merges.
          image: registry.k6nis.dev/innkeeper-relay:1738741
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8646
              name: http
          # The Upstash database the mailboxes live in. Optional so the
          # relay still comes up without it — it falls back to the heap
          # and says so at /v1/health, which is the honest failure and
          # not a silent one. Nothing here can read what it stores:
          # envelopes are sealed end to end, and a mailbox is named
          # after a hash of a public key.
          envFrom:
            - secretRef:
                name: innkeeper-relay-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8646
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8646
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              # Sized off the load pass: 500 daemons and 2000 approvals
              # through one pod. Almost all of that CPU used to be
              # openssl — one subprocess per hello, which is what burst
              # to ~2.9 cores on this node — and hello signatures are
              # verified in-process now, so the request is what a pod
              # actually needs to keep two thousand parked sockets and
              # the limit is headroom for a burst rather than a fence
              # around a fork bomb.
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 800m
              # With the queues on the shelf the pod holds almost
              # nothing; this bounds the blast radius if that turns out
              # to be wrong.
              memory: 256Mi
