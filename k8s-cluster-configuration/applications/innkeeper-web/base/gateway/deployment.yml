apiVersion: apps/v1
kind: Deployment
metadata:
  name: innkeeper-gateway
  namespace: innkeeper
  labels:
    app: innkeeper-gateway
spec:
  # One, and not a choice yet. Tenants are directories on a
  # ReadWriteOnce volume and a gated tool call holds its own thread
  # until a face answers, so a second replica would be a second view of
  # one disk. Postgres and a shared store are the named follow-up; until
  # then this number is load-bearing.
  replicas: 1
  strategy:
    # The volume is ReadWriteOnce, so the new pod cannot mount it while
    # the old one holds it. Recreate makes that a short gap instead of a
    # deadlock that looks like a stuck rollout.
    type: Recreate
  selector:
    matchLabels:
      app: innkeeper-gateway
  template:
    metadata:
      labels:
        app: innkeeper-gateway
    spec:
      containers:
        - name: innkeeper-gateway
          # INTERIM, and the reason is written down rather than left to
          # be discovered: the source of this service is a2wio/
          # innkeeper-private, which is private, and its build-push
          # workflow needs ZOT_ADMIN and ZOT_PASSWORD set on that repo
          # before it can push registry.k6nis.dev/innkeeper-gateway.
          # Until then the code arrives the way darling-page's content
          # does — generated by kustomize in the private repo and
          # applied from there — and runs on the stock python image,
          # which carries the /usr/bin/openssl that verifies a phone's
          # signature. Swapping this for the built image is a two-line
          # change here and nothing else.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "innkeeper_hosted"]
          workingDir: /srv
          env:
            - name: PYTHONPATH
              value: /srv
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: INNKEEPER_ISSUER
              value: https://innkeeper.a2w.io
            - name: INNKEEPER_ENV
              value: production
            - name: INNKEEPER_DATA
              value: /var/lib/innkeeper
            - name: INNKEEPER_HOST
              value: 0.0.0.0
            - name: INNKEEPER_PORT
              value: "8080"
          # INNKEEPER_SECRET, and later the APNs key's details. Every
          # access token this service mints is signed with that secret,
          # so rotating it signs everyone out — which is the correct
          # blast radius for it and worth knowing before you do it.
          envFrom:
            - secretRef:
                name: innkeeper-secrets
                optional: false
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: source
              mountPath: /srv/innkeeper_hosted
              readOnly: true
            - name: data
              mountPath: /var/lib/innkeeper
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi
      volumes:
        # The package's modules, one ConfigMap key each — applied from
        # a2wio/innkeeper-private (deploy/apply.sh), never from this
        # repo, which is public. `fixtures/` is deliberately not here:
        # nothing at runtime reads it, it is what the tests hold the
        # encoder to.
        - name: source
          configMap:
            name: innkeeper-source
        - name: data
          persistentVolumeClaim:
            claimName: innkeeper-data
