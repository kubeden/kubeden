# namespace-scoped; core spawns jobs and refreshes the creds secret,
# nothing cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multirun-core
  namespace: multirun
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multirun-core
  namespace: multirun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: multirun-core
subjects:
  - kind: ServiceAccount
    name: multirun-core
    namespace: multirun
