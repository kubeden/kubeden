# sealed for this cluster's controller — safe in git, useless anywhere else.
# NOT here: claude-creds (rotates; multirun creds push only) and
# registry-credentials (kyverno clones it into every namespace).
# To rotate: build the Secret locally, kubeseal against the cluster, commit.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: multirun-secrets
  namespace: multirun
spec:
  encryptedData:
    NEON_API_KEY: 
    RESULTS_DATABASE_URL: 
  template:
    metadata:
      name: multirun-secrets
      namespace: multirun
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: source-deploy-key
  namespace: multirun
spec:
  encryptedData:
    key: 
  template:
    metadata:
      name: source-deploy-key
      namespace: multirun
    type: Opaque
