apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k6nis-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeden/kubeden.git
    targetRevision: main
    path: k8s-cluster-configuration/platform/argocd/base
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # argocd's own CRDs are applied client-side, which writes the whole
      # object into kubectl.kubernetes.io/last-applied-configuration. That
      # annotation is capped at 262144 bytes and applicationsets.argoproj.io
      # is at 259970 — 2.1KB of headroom. The next chart bump that grows the
      # CRD past that makes argocd unable to apply its own CRDs.
      # Server-side apply writes managedFields instead and never touches the
      # annotation. Every other app on this cluster already sets this.
      - ServerSideApply=true