mountConfig: true
mountSecret: true

service:
  type: ClusterIP
  port: 5000

env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: registry-s3-credentials
        key: accessKey
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: registry-s3-credentials
        key: secretKey

secretFiles:
  htpasswd: |-
    admin:$2y$05$cZoisS5MLIkYpLHp5cpRtesFgMEF6oohITGd1Fs9dYNu5BVdZwHve

# GC is off for now. A pass stats every blob over S3 (~3,300 blobs, 18-50
# minutes here) while holding the image store's single store-wide lock
# (zot v2.1.x has no per-repo locks), so every push and pull waits behind
# it. At zot's default hourly interval the registry was blocked most of
# every hour and CI pushes stalled for many minutes. Plan: prune old tags
# once, then turn GC back on daily ("gc": true, "gcInterval": "24h"); GC
# runs a pass as soon as zot starts, so turn it on when a pass can run.
# Changing this restarts zot, which then re-reads the whole bucket before
# serving (see the startupProbe below).
configFiles:
  config.json: |-
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/tmp/zot",
        "dedupe": false,
        "gc": false,
        "storageDriver": {
          "name": "s3",
          "region": "fsn1",
          "regionendpoint": "https://fsn1.your-objectstorage.com",
          "bucket": "kubeden",
          "rootdirectory": "/infra/zot",
          "secure": true,
          "skipverify": false,
          "forcepathstyle": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {
          "htpasswd": {
            "path": "/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["admin"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ],
              "defaultPolicy": []
            }
          },
          "adminPolicy": {
            "users": ["admin"],
            "actions": ["read", "create", "update", "delete"]
          }
        }
      },
      "extensions": {
        "ui": {
          "enable": true
        },
        "search": {
          "enable": true
        }
      },
      "log": {
        "level": "info"
      }
    }

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Zot opens :5000 only AFTER parsing all storage from S3 into its metadb. On a
# cold start (fresh ephemeral /tmp/zot) that scan of the whole bucket takes
# minutes, and until it finishes /startupz refuses connections. The chart's
# default startup probe (failureThreshold 3 x periodSeconds 10 = ~30s) kills the
# pod mid-parse -> CrashLoopBackOff. Only the timing fields are consumed here
# (the chart injects the /startupz httpGet). ~20 min budget for the parse.
startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 120
