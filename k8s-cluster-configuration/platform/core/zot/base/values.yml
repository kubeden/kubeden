mountConfig: true
mountSecret: true

service:
  type: ClusterIP
  port: 5000

env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: registry-s3-credentials
        key: accessKey
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: registry-s3-credentials
        key: secretKey

secretFiles:
  htpasswd: |-
    admin:$2y$05$cZoisS5MLIkYpLHp5cpRtesFgMEF6oohITGd1Fs9dYNu5BVdZwHve

# GC runs once a day, not zot's default hourly. A pass stats every blob
# over S3 while holding the image store's single store-wide lock (zot
# v2.1.x has no per-repo locks), so every push and pull waits behind it;
# hourly, the registry was blocked most of every hour. GC runs a pass as
# soon as zot starts, then every gcInterval, so the daily pass lands near
# the time zot last restarted: restart it in the evening.
# No "retention" block, on purpose: without one zot keeps every tag and
# removes only untagged manifests, which is how it ran for months. A
# retention policy with no keepTags rules may remove every tag.
# Old commit-sha tags were pruned by hand on 2026-10-08 (210 of 429).
# Changing this restarts zot, which then re-reads the whole bucket before
# serving (see the startupProbe below).
configFiles:
  config.json: |-
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/tmp/zot",
        "dedupe": false,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "storageDriver": {
          "name": "s3",
          "region": "fsn1",
          "regionendpoint": "https://fsn1.your-objectstorage.com",
          "bucket": "kubeden",
          "rootdirectory": "/infra/zot",
          "secure": true,
          "skipverify": false,
          "forcepathstyle": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {
          "htpasswd": {
            "path": "/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["admin"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ],
              "defaultPolicy": []
            }
          },
          "adminPolicy": {
            "users": ["admin"],
            "actions": ["read", "create", "update", "delete"]
          }
        }
      },
      "extensions": {
        "ui": {
          "enable": true
        },
        "search": {
          "enable": true
        }
      },
      "log": {
        "level": "info"
      }
    }

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Zot opens :5000 only AFTER parsing all storage from S3 into its metadb. On a
# cold start (fresh ephemeral /tmp/zot) that scan of the whole bucket takes
# minutes, and until it finishes /startupz refuses connections. The chart's
# default startup probe (failureThreshold 3 x periodSeconds 10 = ~30s) kills the
# pod mid-parse -> CrashLoopBackOff. Only the timing fields are consumed here
# (the chart injects the /startupz httpGet). ~20 min budget for the parse.
startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 120
